<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Best Friend Buddy</title>
  <style>
    @import url('https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap');
    @import url('https://cdn.jsdelivr.net/npm/@fontsource/geist-sans/index.css');

    :root {
      --background: 260 87% 3%;
      --foreground: 40 6% 95%;
      --hero-sub: 40 6% 82%;
      --primary-gradient: linear-gradient(to left, #6366f1, #a855f7, #fcd34d);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: hsl(260, 87%, 3%);
      color: hsl(40, 6%, 95%);
      font-family: 'Geist Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .font-headline {
      font-family: 'General Sans', sans-serif;
    }

    /* Blurred Overlay Shape */
    .blurred-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 984px;
      height: 527px;
      opacity: 0.9;
      background-color: #03000a;
      border-radius: 50%;
      filter: blur(82px);
      pointer-events: none;
      z-index: 0;
    }

    .text-gradient {
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Liquid Glass Utility Class */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      border-radius: 12px;
    }

    .liquid-glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Layout Wrapper */
    .app-wrapper {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      padding: 2rem 1rem;
      z-index: 10;
    }

    /* Buttons */
    .btn {
      padding: 0.85rem 2.2rem;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      font-family: 'Geist Sans', sans-serif;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-primary {
      background: var(--primary-gradient);
      color: white;
      box-shadow: 0 5px 20px rgba(168, 85, 247, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(168, 85, 247, 0.5);
    }

    .btn-secondary {
      background: white;
      color: black;
      box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.9);
      transform: translateY(-2px);
    }

    .btn-no {
      background: rgba(255, 255, 255, 0.05);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-song-opt {
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.05);
      text-transform: none;
      letter-spacing: normal;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
      padding: 1.25rem;
      border-radius: 12px;
      color: white;
      transition: all 0.3s;
    }

    .btn-song-opt:hover {
      background: rgba(255, 255, 255, 0.03);
      transform: translateY(-2px);
      border-color: rgba(168, 85, 247, 0.3);
    }

    /* Pulse emoji */
    @keyframes emoji-pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.4)); }
      50% { transform: scale(1.1); filter: drop-shadow(0 0 30px rgba(168, 85, 247, 0.8)); }
    }

    .animate-emoji-pulse {
      animation: emoji-pulse 3s ease-in-out infinite;
    }

    /* Shake card animation */
    @keyframes shake {
      0% { transform: translateX(0); }
      15% { transform: translateX(-10px); }
      30% { transform: translateX(10px); }
      45% { transform: translateX(-10px); }
      60% { transform: translateX(10px); }
      75% { transform: translateX(-5px); }
      90% { transform: translateX(5px); }
      100% { transform: translateX(0); }
    }

    .animate-shake {
      animation: shake 0.4s ease-in-out;
    }

    /* Marquee scrolling */
    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }

    .animate-marquee {
      animation: marquee 20s linear infinite;
    }

    /* Shimmer loader */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .shimmer-block {
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    /* Audio Visualizer Bar Keyframes */
    @keyframes audio-bar-1 {
      0%, 100% { height: 10px; }
      50% { height: 40px; }
    }
    @keyframes audio-bar-2 {
      0%, 100% { height: 15px; }
      50% { height: 50px; }
    }
    @keyframes audio-bar-3 {
      0%, 100% { height: 8px; }
      50% { height: 45px; }
    }
    @keyframes audio-bar-4 {
      0%, 100% { height: 18px; }
      50% { height: 35px; }
    }

    .animate-bar-1 { animation: audio-bar-1 0.7s ease-in-out infinite alternate; }
    .animate-bar-2 { animation: audio-bar-2 0.5s ease-in-out infinite alternate; }
    .animate-bar-3 { animation: audio-bar-3 0.9s ease-in-out infinite alternate; }
    .animate-bar-4 { animation: audio-bar-4 0.6s ease-in-out infinite alternate; }
  </style>
</head>
<body>

  <!-- Background JS-controlled Fade Looping Video -->
  <div class="absolute inset-0 w-full h-full overflow-hidden pointer-events-none select-none" style="z-index: 0;">
    <video
      id="bg-video"
      src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_065045_c44942da-53c6-4804-b734-f9e07fc22e08.mp4"
      muted
      playsinline
      style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 0.5s ease-in-out; opacity: 0;"
    ></video>
  </div>

  <!-- Centered Blurred Overlay Shape -->
  <div class="blurred-overlay"></div>

  <div class="app-wrapper">
    <!-- Navbar -->
    <nav id="app-nav" style="width: 100%; max-width: 1100px; display: none; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 10;">
      <div class="font-headline" style="font-weight: 700; text-transform: uppercase; font-size: 1.1rem; letter-spacing: 0.1em; color: white;">
        Best Friend <span class="text-gradient">Buddy</span>
      </div>
      <div style="color: #ef4444;">❤️</div>
    </nav>

    <!-- Main Container -->
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; max-width: 1100px; z-index: 10;" id="main-content">
      
      <!-- Screen 1: Hero & Name Input -->
      <div id="screen-1" style="display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%;">
        <nav style="width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); margin-bottom: 4rem;">
          <div class="font-headline" style="font-weight: 700; text-transform: uppercase; font-size: 1.1rem; letter-spacing: 0.1em; color: white;">
            Best Friend <span class="text-gradient">Buddy</span>
          </div>
          <div style="color: #ef4444;">❤️</div>
        </nav>

        <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;">
          <h1 class="font-headline" style="font-size: 60px; font-weight: 700; leading-[1.02]; letter-spacing: -0.02em; color: white; margin-bottom: 1.5rem;">
            Best Friend <span class="text-gradient" style="display: block;">Buddy</span>
          </h1>
          
          <p style="font-size: 1.1rem; color: #d1d1d6; opacity: 0.8; margin-bottom: 3.5rem; letter-spacing: 0.05em;">
            An Unbreakable Bond
          </p>

          <form id="onboarding-form" style="width: 100%; max-width: 320px; display: flex; flex-direction: column; align-items: center; gap: 1.5rem;">
            <div style="width: 100%; text-align: center;">
              <label style="font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: #a855f7; display: block; margin-bottom: 0.75rem;">
                Enter Your Name
              </label>
              <input 
                type="text" 
                id="user-name-input" 
                placeholder="Your Name" 
                required
                className="liquid-glass"
                style="width: 100%; padding: 1.25rem; font-size: 1.1rem; color: white; text-align: center; font-family: 'Geist Sans', sans-serif; background: rgba(255,255,255,0.01); border: 1px solid rgba(255,255,255,0.1); border-radius: 50px; outline: none; transition: border 0.3s;"
              >
            </div>
            
            <button 
              type="submit" 
              class="btn btn-secondary" 
              style="padding: 1.25rem 2.25rem; border-radius: 50px;"
            >
              Start Journey ➔
            </button>
          </form>
        </div>
      </div>

    </div>

    <!-- Infinite Scrolling Marquee Footer -->
    <footer style="width: 100%; overflow: hidden; py-6; z-index: 10; select-none; position: relative; margin-top: auto;">
      <div style="position: absolute; inset-y: 0; left: 0; width: 100px; z-index: 10; pointer-events: none; background: linear-gradient(to right, hsl(260, 87%, 3%) 0%, transparent 100%);"></div>
      <div style="position: absolute; inset-y: 0; right: 0; width: 100px; z-index: 10; pointer-events: none; background: linear-gradient(to left, hsl(260, 87%, 3%) 0%, transparent 100%);"></div>
      <div class="flex" style="display: flex; white-space: nowrap;" id="marquee-track"></div>
    </footer>
  </div>

  <!-- Audio Element -->
  <audio id="html5-audio" style="display: none;"></audio>

  <!-- Confetti script -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    // ----------------------------------------------------
    // Configurations
    // ----------------------------------------------------
    const geminiApiKey = "AIzaSyDLuHcrtERz0PPmnsPSrGwRStj1ZfB4UZs"; // Gemini API key
    let friendName = "";
    let shakeCount = 0;
    let shayariCount = 1;
    let selectedSong = null;
    let songTimeout = null;

    const warningMessages = [
      "Please soch lo! 🥺",
      "Ek aur chance do! 🙏",
      "Galti sabhi se hoti hai... 😿",
      "Hum best friends hain na? ❤️",
      "Chalo maan bhi jao... ✨",
      "Wicky is really sorry! 🙏"
    ];

    const songsList = [
      { id: 1, title: "Khat by Navjot Ahuja", tag: "Emotional", file: "/songs/song1.mp3", web: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
      { id: 2, title: "Dooran Doran", tag: "Romantic", file: "/songs/song2.mp3", web: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
      { id: 3, title: "Arz Kiya Hai", tag: "Soft", file: "/songs/song3.mp3", web: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" }
    ];

    // ----------------------------------------------------
    // Video Controller
    // ----------------------------------------------------
    const video = document.getElementById('bg-video');
    video.onplay = () => {
      video.style.opacity = '1';
    };
    video.onended = () => {
      video.style.opacity = '0';
      setTimeout(() => {
        video.currentTime = 0;
        video.play().catch(err => console.log(err));
      }, 600);
    };
    
    window.addEventListener('load', () => {
      video.play().catch(err => console.log("Video auto play prevented."));
    });

    // ----------------------------------------------------
    // Footer Marquee Builder
    // ----------------------------------------------------
    const marqueeItems = [
      { text: "Forever Bond", emoji: "🤝" },
      { text: "Best Friends", emoji: "💖" },
      { text: "True Love", emoji: "✨" },
      { text: "Sorry & Love", emoji: "🥺" },
      { text: "Forgiven", emoji: "🌸" }
    ];
    const marqueeList = [...marqueeItems, ...marqueeItems];
    const marqueeTrack = document.getElementById('marquee-track');
    marqueeList.forEach(item => {
      const el = document.createElement('div');
      el.className = 'liquid-glass';
      el.style.margin = '0 1rem';
      el.style.padding = '0.75rem 1.75rem';
      el.style.display = 'inline-flex';
      el.style.alignItems = 'center';
      el.style.gap = '0.5rem';
      el.style.borderRadius = '50px';
      el.style.animation = 'marquee 20s linear infinite';
      el.innerHTML = `<span style="font-size: 1.1rem;">${item.emoji}</span><span style="font-family: 'General Sans', sans-serif; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; color: #e5e5ea;">${item.text}</span>`;
      marqueeTrack.appendChild(el);
    });

    // Inject marquee anim dynamic CSS
    const style = document.createElement('style');
    style.innerHTML = `
      .flex { display: flex; }
      #marquee-track { display: flex; animation: marquee 20s linear infinite; }
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
    `;
    document.head.appendChild(style);

    // ----------------------------------------------------
    // Screen Navigation & Actions
    // ----------------------------------------------------
    const form = document.getElementById('onboarding-form');
    form.onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById('user-name-input');
      friendName = input.value.trim();
      if (friendName) {
        showScreen2();
      }
    };

    function showScreen2() {
      document.getElementById('app-nav').style.display = 'flex';
      
      const content = document.getElementById('main-content');
      content.innerHTML = `
        <div id="screen-2" class="liquid-glass" style="width: 100%; max-width: 440px; padding: 2.75rem; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05); margin: 0 1rem;">
          <div class="animate-emoji-pulse" style="font-size: 4rem; margin-bottom: 1.5rem; display: inline-block;">🥺</div>
          <h2 class="font-headline" style="font-size: 1.8rem; font-weight: 700; color: white; margin-bottom: 0.75rem; tracking-wide;">
            Mujhe maaf kar diya kya?
          </h2>
          <p style="font-size: 0.85rem; color: #d1d1d6; opacity: 0.8; line-height: 1.6; margin-bottom: 2.5rem;">
            I know I was wrong, and I'm really sorry. Please click 'Yes' to forgive me.
          </p>
          
          <div id="btn-container" style="display: flex; justify-content: center; align-items: center; gap: 1.5rem; min-height: 80px; position: relative; flex-direction: row;">
            <button class="btn btn-primary" onclick="triggerYesConfetti()" style="z-index: 10;">
              Yes, Maaf Kiya! ❤️
            </button>
            <button id="no-btn" class="btn btn-no" onclick="handleNahiClick()">
              Nahi 🥺
            </button>
          </div>
          
          <div id="toast-container" style="margin-top: 1.5rem; min-height: 30px;"></div>
        </div>
      `;
    }

    // ----------------------------------------------------
    // Sticky Shake Apology logic
    // ----------------------------------------------------
    function handleNahiClick() {
      const card = document.getElementById('screen-2');
      if (!card) return;

      // 1. Play shake animation
      card.classList.remove('animate-shake');
      void card.offsetWidth; // Trigger reflow to restart CSS animation
      card.classList.add('animate-shake');

      // 2. Display Toast Message
      const toast = document.getElementById('toast-container');
      const msg = warningMessages[shakeCount % warningMessages.length];
      shakeCount++;

      toast.innerHTML = `
        <div style="background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.25); border-radius: 50px; padding: 0.5rem 1.25rem; font-size: 0.75rem; font-weight: 600; color: #fda4af; display: inline-block; animation: slideUp 0.3s ease;">
          ${msg}
        </div>
      `;
    }

    // ----------------------------------------------------
    // Screen 3: Shayari Sequence & Song Selection
    // ----------------------------------------------------
    function triggerYesConfetti() {
      // Confetti burst
      confetti({
        particleCount: 150,
        spread: 80,
        origin: { y: 0.6 },
        colors: ["#6366f1", "#a855f7", "#fcd34d", "#f43f5e"]
      });

      // 2-second delay transition to Screen 3
      const card = document.getElementById('screen-2');
      if (card) {
        card.style.opacity = '0.5';
        card.style.pointerEvents = 'none';
      }
      
      setTimeout(() => {
        showScreen3();
      }, 2000);
    }

    function showScreen3() {
      const content = document.getElementById('main-content');
      content.innerHTML = `
        <div style="display: flex; flex-direction: column; align-items: center; gap: 1.5rem; width: 100%; max-width: 480px; margin: 0 1rem;">
          
          <!-- Celebration Header -->
          <div class="liquid-glass" style="width: 100%; padding: 1.5rem; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05);">
            <h2 class="font-headline" style="font-size: 1.6rem; font-weight: 700; color: white;">
              Yay! Thank you, <span class="text-gradient">${friendName}</span>! 🎉
            </h2>
          </div>

          <!-- Shayari Card -->
          <div class="liquid-glass" style="width: 100%; padding: 2.5rem; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05);" id="shayari-card-inner">
            <!-- Loading states will render here -->
          </div>

        </div>
      `;

      fetchGeminiShayari();
    }

    async function fetchGeminiShayari() {
      const card = document.getElementById('shayari-card-inner');
      
      // Render loading shimmer loader
      card.innerHTML = `
        <div style="display: flex; flex-direction: column; align-items: center; py-6; width:100%;">
          <span style="font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 1rem;">Shayari Step ${shayariCount} of 3</span>
          <div class="shimmer-block" style="height: 1.25rem; width: 85%; border-radius: 6px; margin-bottom: 0.75rem;"></div>
          <div class="shimmer-block" style="height: 1.25rem; width: 70%; border-radius: 6px; margin-bottom: 0.75rem;"></div>
          <div class="shimmer-block" style="height: 1.25rem; width: 80%; border-radius: 6px; margin-bottom: 1.5rem;"></div>
          <div class="shimmer-block" style="height: 0.85rem; width: 50%; border-radius: 6px; margin-bottom: 0.5rem;"></div>
          <p style="font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-top: 1.5rem;">
            Writing Shayari ${shayariCount} for <strong style="color: #a855f7;">${friendName}</strong>... ✍️
          </p>
        </div>
      `;

      try {
        const prompt = `Write a 4-line Hindi/Urdu friendship Shayari. It MUST include the name '${friendName}' naturally in the poem. Provide a short English translation. Return strictly as a JSON object with keys "shayari" and "translation".`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              responseMimeType: "application/json"
            }
          })
        });

        if (!response.ok) throw new Error("API call failed");

        const data = await response.json();
        const responseText = data.candidates[0].content.parts[0].text;
        const parsed = JSON.parse(responseText);

        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.75rem; color: rgba(255,255,255,0.5);">
            <span style="font-weight: 700; text-transform: uppercase;">Shayari Step ${shayariCount} of 3</span>
            <span>📜</span>
          </div>
          
          <p class="font-headline" style="font-size: 1.4rem; font-weight: 600; line-height: 1.7; font-style: italic; color: white; white-space: pre-line; margin-bottom: 1.75rem;">
            ${parsed.shayari}
          </p>
          
          <div style="border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 1.25rem; margin-top: 1.25rem; margin-bottom: 2rem;">
            <span style="font-size: 0.6rem; font-weight: 700; text-transform: uppercase; tracking-wider; color: #fbbf24; display: block; margin-bottom: 0.25rem;">Translation</span>
            <p style="font-size: 0.8rem; color: rgba(255, 255, 255, 0.6); font-style: italic; line-height: 1.5;">
              "${parsed.translation}"
            </p>
          </div>
          
          <div id="shayari-action-btn-container">
            ${
              shayariCount < 3
                ? `<button class="btn btn-primary" onclick="advanceShayari()" style="font-size: 0.75rem; padding: 0.75rem 1.75rem;">Agli Shayari ➔</button>`
                : `<button class="btn btn-primary" onclick="openSongModal()" style="font-size: 0.75rem; padding: 0.85rem 2rem; background: linear-gradient(to right, #ec4899, #8b5cf6);">🎵 Choose a Song for Us</button>`
            }
          </div>
        `;
      } catch (err) {
        console.error(err);
        card.innerHTML = `
          <div style="font-size: 2.5rem; margin-bottom: 1rem;">⚠️</div>
          <p style="font-size: 0.85rem; color: #fca5a5; margin-bottom: 1.5rem; font-weight: 600;">
            Failed to write Shayari using Gemini API.
          </p>
          <button class="btn btn-secondary" onclick="fetchGeminiShayari()" style="padding: 0.75rem 1.5rem; font-size: 0.75rem;">
            Try Again 🔄
          </button>
        `;
      }
    }

    function advanceShayari() {
      if (shayariCount < 3) {
        shayariCount++;
        fetchGeminiShayari();
      }
    }

    // ----------------------------------------------------
    // Song Selection Modal / Audio play
    // ----------------------------------------------------
    function openSongModal() {
      const card = document.getElementById('shayari-card-inner');
      card.innerHTML = `
        <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
          <h4 style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; tracking-wider; color: #a855f7; margin-bottom: 1.5rem;">
            🎵 Choose a Song for Us
          </h4>
          
          <div style="display: flex; flex-direction: column; gap: 1rem; width: 100%;">
            ${songsList.map(song => `
              <button class="btn-song-opt" onclick="playSelectedSong(${song.id})">
                <div>
                  <h5 style="font-family: 'General Sans', sans-serif; font-size: 1.05rem; font-weight: 700; color: white;">${song.title}</h5>
                  <span style="font-size: 0.65rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.05em;">${song.tag}</span>
                </div>
                <div style="width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; font-size: 0.75rem;">▶</div>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    const audio = document.getElementById('html5-audio');

    function playSelectedSong(id) {
      selectedSong = songsList.find(s => s.id === id);
      const card = document.getElementById('shayari-card-inner');
      
      card.innerHTML = `
        <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
          <span style="font-size: 0.7rem; font-weight: 700; text-transform: uppercase; tracking-wider; color: #f472b6; margin-bottom: 1rem; display: block;">Now Playing</span>
          
          <h4 class="font-headline" style="font-size: 1.4rem; font-weight: 700; color: white; margin-bottom: 0.25rem;">
            ${selectedSong.title}
          </h4>
          <p style="font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-bottom: 1.5rem;">
            Playing our special theme melody...
          </p>

          <!-- Animated visualizer waves -->
          <div style="display: flex; align-items: end; justify-content: center; gap: 6px; height: 50px; margin-bottom: 1.5rem;">
            <div class="w-1.5 bg-indigo-400 rounded-t-full animate-bar-1" style="width: 6px;"></div>
            <div class="w-1.5 bg-purple-500 rounded-t-full animate-bar-2" style="width: 6px;"></div>
            <div class="w-1.5 bg-amber-400 rounded-t-full animate-bar-3" style="width: 6px;"></div>
            <div class="w-1.5 bg-pink-500 rounded-t-full animate-bar-4" style="width: 6px;"></div>
            <div class="w-1.5 bg-indigo-400 rounded-t-full animate-bar-2" style="width: 6px;"></div>
          </div>

          <!-- Progress bar track -->
          <div style="width: 100%; display: flex; flex-direction: column; gap: 0.5rem;">
            <div style="width: 100%; bg: rgba(255,255,255,0.05); height: 6px; border-radius: 50px; overflow: hidden; background: rgba(255,255,255,0.05);">
              <div id="song-progress" style="background: var(--primary-gradient); height: 100%; width: 0%; border-radius: 50px; transition: width 0.3s;"></div>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 0.65rem; color: rgba(255,255,255,0.4); font-weight: 600;">
              <span id="current-time">0:00</span>
              <span id="duration-time">0:00</span>
            </div>
          </div>

          <!-- Skip Option -->
          <button onclick="handleSongFinish()" style="margin-top: 1.5rem; background: none; border: none; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: rgba(255,255,255,0.4); cursor: pointer;">
            Skip Song & See Letter ➔
          </button>
        </div>
      `;

      // Set audio parameters and play
      audio.src = selectedSong.file;
      audio.load();
      audio.play().catch(err => {
        console.warn("Autoplay blocked. Loading web fallback...");
        audio.src = selectedSong.web;
        audio.load();
        audio.play().catch(err => console.log(err));
      });

      // Progress bar trackers
      audio.ontimeupdate = () => {
        const current = audio.currentTime;
        const duration = audio.duration || 30; // fallback
        const percent = (current / duration) * 100;
        
        const prog = document.getElementById('song-progress');
        if (prog) prog.style.width = percent + '%';
        
        const curEl = document.getElementById('current-time');
        if (curEl) curEl.innerText = formatTimeStr(current);
      };

      audio.onloadedmetadata = () => {
        const durEl = document.getElementById('duration-time');
        if (durEl) durEl.innerText = formatTimeStr(audio.duration);
      };

      // Audio error load callback fallback
      audio.onerror = () => {
        if (audio.src.includes("/songs/")) {
          audio.src = selectedSong.web;
          audio.load();
          audio.play().catch(err => console.log("Fallback play error"));
        }
      };

      // CRITICAL: onEnded callback auto-advances to screen 4
      audio.onended = () => {
        handleSongFinish();
      };

      // 30 Seconds Fallback Timeout
      songTimeout = setTimeout(() => {
        handleSongFinish();
      }, 30000);
    }

    function formatTimeStr(time) {
      if (isNaN(time)) return "0:00";
      const m = Math.floor(time / 60);
      const s = Math.floor(time % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function handleSongFinish() {
      if (songTimeout) clearTimeout(songTimeout);
      audio.pause();
      showScreen4();
    }

    // ----------------------------------------------------
    // Screen 4: Thank You Screen (Final)
    // ----------------------------------------------------
    function showScreen4() {
      const content = document.getElementById('main-content');
      content.innerHTML = `
        <div id="screen-4" class="liquid-glass" style="width: 100%; max-width: 440px; padding: 3rem 2rem; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05); margin: 0 1rem;">
          <div style="font-size: 5rem; margin-bottom: 1.5rem; display: inline-block;">💝</div>
          
          <h2 class="font-headline" style="font-size: 2.2rem; font-weight: 700; color: white; margin-bottom: 1rem; line-height: 1.2;">
            Thank You, <span class="text-gradient">${friendName}</span>!
          </h2>
          
          <p style="font-size: 1.05rem; color: rgba(255,255,255,0.8); line-height: 1.6; margin-bottom: 2.5rem;">
            Your forgiveness means the world to me. Our bond is forever.
          </p>

          <button class="btn btn-primary" onclick="triggerFinalBurst()" style="padding: 1.25rem 2.25rem;">
            Let's Stay Friends Forever, ${friendName}! ❤️
          </button>
        </div>
      `;

      triggerFinalBurst();
      startFinalConfettiRain();
    }

    function triggerFinalBurst() {
      confetti({
        particleCount: 150,
        spread: 80,
        origin: { y: 0.6 },
        colors: ["#6366f1", "#a855f7", "#fcd34d", "#f43f5e"]
      });
    }

    let loopRain = true;
    function startFinalConfettiRain() {
      loopRain = true;
      const rainFrame = () => {
        if (!loopRain) return;
        confetti({
          particleCount: 1,
          angle: 60,
          spread: 55,
          origin: { x: 0, y: 0.8 },
          colors: ["#6366f1", "#a855f7", "#fcd34d", "#f43f5e"]
        });
        confetti({
          particleCount: 1,
          angle: 120,
          spread: 55,
          origin: { x: 1, y: 0.8 },
          colors: ["#6366f1", "#a855f7", "#fcd34d", "#f43f5e"]
        });
        requestAnimationFrame(rainFrame);
      };
      rainFrame();
    }

    window.addEventListener('beforeunload', () => {
      loopRain = false;
    });
  </script>
</body>
</html>
